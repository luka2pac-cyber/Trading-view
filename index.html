<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f0f">
<title>Luka Charts</title>
<style>
:root{--bg:#0f0f0f;--chart:#131722;--panel:#1e222d;--pop:#1e222d;--line:#2a2e39;--hov:#2a2e39;--ink:#d1d4dc;--mute:#787b86;--acc:#2962ff;--up:#089981;--dn:#f23645}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 -apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button,select,input{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:4px}
button{cursor:pointer;padding:6px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--hov)}
button.on{color:#2962ff}
button:disabled{opacity:.3;cursor:default;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
input[type=text],input[type=search]{background:var(--chart);border:1px solid var(--line);padding:8px 10px;font-size:14px;-webkit-user-select:text;user-select:text}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-rows:42px 1fr 32px;grid-template-columns:48px 1fr 300px 46px;height:100dvh}
#app.nowl{grid-template-columns:48px 1fr 0 46px}
#top{grid-column:1/5;display:flex;align-items:center;gap:1px;padding:0 6px;background:var(--bg);border-bottom:4px solid var(--bg);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#top>*{flex:none}
.vs{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
#symBtn{font-weight:700;padding:6px 10px;border-radius:16px;background:var(--panel);min-width:96px;justify-content:flex-start}
#tfFav button{padding:6px 7px;font-weight:600}
.caret{font-size:9px;color:var(--mute)}
#price{font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px 0 6px}
#chg{font-variant-numeric:tabular-nums;padding-right:6px}
.up{color:var(--up)}.dn{color:var(--dn)}
.grow{flex:1 1 auto!important}
#left{display:flex;flex-direction:column;align-items:center;padding:4px 0;background:var(--bg);border-right:4px solid var(--bg);overflow-y:auto;scrollbar-width:none}
#left::-webkit-scrollbar{display:none}
.tg{position:relative;display:flex;width:44px;flex:none}
.tg>button:first-child{width:36px;height:36px;padding:0;justify-content:center}
.tg>.more{width:8px;padding:0;height:36px;justify-content:center;opacity:0;font-size:8px;color:var(--mute)}
.tg:hover>.more{opacity:1}
@media(pointer:coarse){.tg>.more{opacity:.7}}
#left .hs{width:28px;height:1px;background:var(--line);margin:5px 0;flex:none}
#chart{position:relative;overflow:hidden;background:var(--chart);border-radius:0 6px 6px 0}
#k{position:absolute;inset:0}
#wl{background:var(--chart);margin-left:4px;border-radius:6px 0 0 6px;display:flex;flex-direction:column;overflow:hidden}
#app.nowl #wl{display:none}
#rstrip{background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:2px;border-left:4px solid var(--bg)}
#rstrip button{width:38px;height:38px;padding:0;justify-content:center}
#rstrip button.on{background:var(--hov);color:#fff}
.wlTop{display:flex;align-items:center;padding:8px 8px 4px 12px;gap:4px}
.wlTop b{flex:1;font-size:14px}
.wlh{display:grid;grid-template-columns:1fr 78px 62px;padding-left:40px!important;padding:6px 12px;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line)}
.wlList{overflow-y:auto;flex:1}
.grp{padding:12px 12px 4px;color:var(--mute);font-size:11px;cursor:pointer}
.grp::before{content:"⌄  "}.grp.closed::before{content:"›  "}
.row .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-right:8px}
.row .a{display:none}
.row .sy{display:inline}
.row{display:grid;grid-template-columns:28px 1fr 78px 62px;align-items:center;padding:6px 12px;cursor:pointer;border:1px solid transparent;font-variant-numeric:tabular-nums}
.row:hover{background:var(--hov)}
.row.sel{border-color:#5d606b;border-radius:4px;background:var(--panel)}
.row b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n,.row .p{text-align:right;white-space:nowrap;overflow:hidden}
.row small{display:block;color:var(--mute);font-size:10px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-left:5px;vertical-align:middle}
.wlf{padding:12px;color:var(--mute);font-size:11px;line-height:1.5}
#bottom{grid-column:2/3;display:flex;align-items:center;gap:1px;padding:0 6px;background:var(--bg);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
#bottom::-webkit-scrollbar{display:none}
#bottom>*{flex:none}
#bottom button{padding:4px 7px;font-size:12px}
#bottomL{grid-column:1/2;background:var(--bg)}
#bottomR{grid-column:3/5;background:var(--bg);display:flex;align-items:center;padding:0 10px;gap:8px;color:var(--mute);font-size:11px;overflow:hidden;white-space:nowrap}
#dot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
#dot.ok{background:var(--up)}#dot.bad{background:var(--dn)}#dot.delay{background:#f7a600}
#clock{font-variant-numeric:tabular-nums}
.pop{position:fixed;z-index:40;background:var(--pop);border-radius:6px;padding:6px 0;box-shadow:0 2px 4px #0006,0 8px 28px #000a;display:none;min-width:200px;max-height:80vh;overflow:auto}
.pop.open{display:block}
.pop .it{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.pop .it:hover{background:var(--hov)}
.pop .it.on{color:var(--acc)}
.pop .it kbd{margin-left:auto;padding-left:16px;color:var(--mute);font-size:11px;font-family:inherit}
.pop .hd{padding:8px 14px 4px;color:var(--mute);font-size:11px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.modal{position:fixed;inset:0;z-index:50;background:#0009;display:none;align-items:flex-start;justify-content:center;padding-top:8vh}
.modal.open{display:flex}
.dlg{background:var(--pop);border-radius:8px;width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 40px #000c}
.dlg header{display:flex;align-items:center;padding:14px 16px;font-size:18px;font-weight:600}
.dlg header button{margin-left:auto;font-size:18px}
.dlg .srch{padding:0 16px 10px}
.dlg .srch input{width:100%}
.dlg .body{overflow-y:auto;padding-bottom:8px}
.dlg .li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 16px;cursor:pointer}
.dlg .li:hover{background:var(--hov)}
.dlg .li small{color:var(--mute)}
.dlg .sec{padding:10px 16px 4px;color:var(--mute);font-size:11px;text-transform:uppercase}
.dlg .act{display:flex;gap:6px;align-items:center}
.dlg .act input{width:120px;padding:5px 8px;font-size:12px}
.dlg .frm{padding:6px 16px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.dlg .frm input[type=color]{width:44px;height:30px;padding:0;border:0}
#dtb{position:absolute;z-index:30;top:10px;left:50%;transform:translateX(-50%);background:var(--pop);border-radius:6px;box-shadow:0 4px 18px #000a;display:none;align-items:center;padding:3px}
#dtb.open{display:flex}
#dtb button{height:32px;padding:0 8px}
#dtb .sw{width:18px;height:18px;border-radius:3px;border:1px solid #fff4}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--pop);padding:8px 14px;border-radius:6px;display:none;z-index:60;box-shadow:0 4px 18px #000a}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:5px 12px;border-radius:4px;font-size:12px;display:none;z-index:25;pointer-events:none;white-space:nowrap}
.monly{display:none!important}
#fab{position:absolute;right:62px;bottom:14px;z-index:20;width:46px;height:46px;border-radius:50%;background:#2a2e39;justify-content:center;box-shadow:0 4px 14px #000a}
#mnav{background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
#mnav button{flex:1;flex-direction:column;gap:2px;font-size:11px;color:var(--mute);border-radius:0;justify-content:center}
#mnav button.on{color:#fff}
.pop.sheet{left:0!important;right:0!important;top:auto!important;bottom:0!important;border-radius:14px 14px 0 0;max-height:72vh;padding:8px 0 calc(12px + env(safe-area-inset-bottom));min-width:0}
.pop.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#434651;margin:2px auto 8px}
.pop.sheet .it{padding:13px 18px;font-size:15px}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:2px 10px 6px}
.tgrid .it{flex-direction:column;gap:6px;padding:10px 4px!important;font-size:11px!important;text-align:center;white-space:normal;border-radius:8px}
.tgrid .it.on{background:#2962ff22}
@media(max-width:900px){
  .monly{display:flex!important}
  #app,#app.nowl{grid-template-rows:48px minmax(0,1fr) 58px!important;grid-template-columns:minmax(0,1fr)!important}
  #top{grid-column:1/-1;border-bottom:1px solid var(--line);gap:0}
  #top .vs,#tfFav,#tfMore,#redoBtn,#setBtn,#fsBtn,#snap,#wlBtnM,#indBtn span{display:none!important}
  #symBtn{min-width:0;padding:6px 10px;background:transparent;font-size:16px}
  #symBtn svg{display:none}
  #price{font-size:13px}#chg{font-size:12px}
  #left,#bottom,#bottomL,#bottomR,#rstrip{display:none!important}
  #chart{grid-column:1/-1;grid-row:2;border-radius:0}
  #mnav{grid-column:1/-1;grid-row:3}
  #wl{position:fixed!important;top:48px!important;bottom:58px!important;left:0;right:0;width:auto!important;z-index:35;border-radius:0!important;margin:0!important;box-shadow:none!important}
  #dtb{top:auto;bottom:70px}
  /* --- watchlist kot TradingView mobilna aplikacija --- */
  #app{--bg:#000}
  body,#top,#mnav{background:#000}
  #wl{background:#000!important;font-family:Roboto,-apple-system,"Segoe UI",system-ui,sans-serif}
  #wl .wlTop{padding:6px 10px 6px 8px;gap:6px;border-bottom:1px solid #1e1e1e;height:58px}
  #wl .wlTop>b,#wl .wlTop>#wlSearch{display:none}
  #wlPills{flex:1;overflow-x:auto;gap:8px;scrollbar-width:none;align-items:center}
  #wlPills::-webkit-scrollbar{display:none}
  #wlPills button{flex:none;font-size:19px;font-weight:500;color:#8a8a8a;padding:7px 14px;border-radius:12px;background:transparent}
  #wlPills button.on{background:#2e2e2e;color:#f0f0f0}
  #wl .wlh{display:none}
  #wl .grp{padding:18px 18px 8px;font-size:13px;letter-spacing:.03em;color:#8a8a8a;font-weight:500}
  #wl .row{display:grid;grid-template-columns:50px minmax(0,1fr) auto auto;grid-template-rows:auto auto;column-gap:0;row-gap:3px;align-items:center;
    min-height:74px;padding:10px 17px;margin:0;border:0;border-radius:0;position:relative;font-family:inherit}
  #wl .row::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:#262626}
  #wl .row.sel{background:#121212;border:0}
  #wl .row:hover{background:#0d0d0d}
  #wl .row .ic{grid-row:1/3;grid-column:1;width:38px;height:38px;font-size:18px;margin:0}
  #wl .row b{display:contents}
  #wl .row .sy{grid-row:1;grid-column:2;font-size:20px;font-weight:700;color:#dcdcdc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wl .row small{grid-row:2;grid-column:2;font-size:18px;font-weight:400;color:#808080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
  #wl .row .n{grid-row:1;grid-column:3/5;font-size:20px;font-weight:600;color:#dcdcdc;text-align:right}
  #wl .row .a{display:inline;grid-row:2;grid-column:3;justify-self:end;font-size:18px;margin-right:12px;white-space:nowrap}
  #wl .row .p{grid-row:2;grid-column:4;white-space:nowrap;justify-self:end;font-size:18px;text-align:right}
  #wl .row .live{width:7px;height:7px;margin-left:6px}
  #wl .wlf{font-size:12px;color:#666;padding:16px 18px 24px}
  #mnav{height:58px}
  #mnav button{font-size:13.5px;font-weight:500;color:#9a9a9a;gap:4px}
  #mnav button .i{width:26px;height:26px;stroke-width:1.7}
  #mnav button.on{color:#f0f0f0}
  #mnav button:hover,#mnav button:active{background:none}
  #app.wlopen #top{display:none!important}
  #app.wlopen #wl{top:0!important}

  #hint{top:8px;white-space:normal;max-width:90%;text-align:center}

  #app,#app.nowl{grid-template-columns:42px 1fr 0 0}
  #rstrip{display:none}
  #wl{position:fixed;top:42px;right:0;bottom:32px;width:min(340px,92vw);z-index:35;box-shadow:-8px 0 24px #000a;border-radius:0;margin:0}
  #app:not(.wlopen) #wl{display:none}
  #app.wlopen #wl{display:flex}
  .tg{width:40px}.tg>button:first-child{width:34px;height:34px}
  #bottomR{display:none}#bottom{grid-column:2/5}
  .hidem{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="symBtn" title="Iskanje simbola"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span id="symName">—</span></button>
    <span id="price">—</span><span id="chg"></span>
    <div class="vs"></div>
    <div id="tfFav" style="display:flex"></div>
    <button id="tfMore" title="Interval" data-popbtn="1"><span class="caret">▼</span></button>
    <div class="vs"></div>
    <button id="ctBtn" title="Vrsta grafa" data-popbtn="1"></button>
    <div class="vs"></div>
    <button id="indBtn" title="Indikatorji ( / )"><svg class="i" viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg><span class="hidem">Indikatorji</span></button>
    <div class="vs"></div>
    <button id="undoBtn" title="Razveljavi (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg></button>
    <button id="redoBtn" title="Uveljavi (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h4"/></svg></button>
    <div class="grow"></div>
    <button id="setBtn" title="Nastavitve"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    <button id="fsBtn" title="Celozaslonski način"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <button id="snap" title="Posnetek grafa (PNG)"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button id="mTf" class="monly" data-popbtn="1" title="Interval" style="font-weight:700">D</button>
    <button id="mMore" class="monly" data-popbtn="1" title="Več" style="font-size:20px;padding:4px 10px">⋯</button>
    <button id="wlBtnM" title="Watchlist" style="display:none"><svg class="i" viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 12h8M8 15h5"/></svg></button>
  </div>
  <div id="left"></div>
  <div id="chart"><div id="k"></div><button id="fab" class="monly" data-popbtn="1" title="Risanje"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button><div id="dtb"></div><div id="hint"></div></div>
  <div id="wl">
    <div class="wlTop"><button id="wlMenu" class="monly" title="Skupine" style="padding:6px"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div id="wlPills" class="monly"></div><b>Watchlist</b><button id="wlSearch" title="Poišči / dodaj simbol"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <div class="wlh"><span>Simbol</span><span style="text-align:right">Zadnja</span><span style="text-align:right">Spr. %</span></div>
    <div class="wlList" id="wlList"></div>
  </div>
  <div id="rstrip">
    <button id="wlBtn" class="on" title="Watchlist"><svg class="i" viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 12h8M8 15h5"/></svg></button>
  </div>
  <div id="bottomL"></div>
  <div id="bottom">
    <div id="ranges" style="display:flex"></div>
    <div class="vs"></div>
    <span id="dot"></span>&nbsp;<span id="st" style="color:var(--mute);font-size:11px">Nalagam…</span>
    <div class="grow"></div>
    <button id="clockBtn" title="Časovni pas" data-popbtn="1"><span id="clock"></span></button>
    <div class="vs"></div>
    <button id="pctBtn" title="Odstotna lestvica">%</button>
    <button id="logBtn" title="Logaritemska lestvica">log</button>
    <button id="autoBtn" class="on" title="Samodejno prilagodi">auto</button>
  </div>
  <div id="bottomR"><span id="info"></span></div>
  <nav id="mnav" class="monly">
    <button data-tab="wl"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Watchlist</span></button>
    <button data-tab="chart" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M8 4v16M16 6v12"/><rect x="6" y="8" width="4" height="8"/><rect x="14" y="9" width="4" height="6"/></svg><span>Graf</span></button>
    <button data-tab="search"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span>Iskanje</span></button>
    <button data-tab="menu" data-popbtn="1"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Meni</span></button>
  </nav>
</div>
<div class="pop" id="pop"></div>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/klinecharts@10.1.0/dist/umd/klinecharts.min.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('lc_'+k); return v==null?d:JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('lc_'+k, JSON.stringify(v)) }catch(e){} }
};
const toast = t => { const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',2200) };
const fmt = (v, pp) => v==null||isNaN(v) ? '—' : Number(v).toLocaleString('en-US',{minimumFractionDigits:pp,maximumFractionDigits:pp});
const ppFor = v => v==null ? 2 : Math.abs(v) < 5 ? 4 : Math.abs(v) < 50 ? 3 : 2;
const agoTxt = ms => { const m=Math.round((Date.now()-ms)/6e4); return m<1?'pravkar':m<60?m+' min nazaj':m<1440?Math.round(m/60)+' h nazaj':Math.round(m/1440)+' dni nazaj' };
const hexA = (h, a) => { const n=parseInt(h.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+(a/100)+')' };
const SV = p => '<svg class="i" viewBox="0 0 24 24">'+p+'</svg>';

/* ---------- intervali ---------- */
const TFS = [
  {k:'1m',l:'1 minuta',res:'1',ms:6e4,p:{type:'minute',span:1},dv:'60'},
  {k:'3m',l:'3 minute',res:'3',ms:18e4,p:{type:'minute',span:3}},
  {k:'5m',l:'5 minut',res:'5',ms:3e5,p:{type:'minute',span:5}},
  {k:'15m',l:'15 minut',res:'15',ms:9e5,p:{type:'minute',span:15},y:'15m'},
  {k:'30m',l:'30 minut',res:'30',ms:18e5,p:{type:'minute',span:30}},

const WS_URL = 'wss://www.deribit.com/ws/api/v2';

function setStatus(t, cls){ $('#st').textContent=t; $('#dot').className=cls||'' }
function connect(){
  wsReady = new Promise(res => {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => { retry=0; wsOk=true; rpc('public/set_heartbeat',{interval:30}).catch(()=>{});

      res(); updateStatus() };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.id && pending[m.id]) { const p=pending[m.id]; delete pending[m.id]; m.error ? p.rej(m.error) : p.res(m.result); return }
      if (m.method==='heartbeat' && m.params && m.params.type==='test_request') { rpc('public/test',{}).catch(()=>{}); return }
      if (m.method==='subscription') { const cb=subs.get(m.params.channel); if (cb) cb(m.params.data) }
    };
    ws.onclose = () => { wsOk=false; updateStatus();
      Object.values(pending).forEach(p=>p.rej({message:'Deribit povezava prekinjena'})); pending={};

async function rpc(method, params){

}

const weekStart = ts => { const d=new Date(ts); const day=(d.getUTCDay()+6)%7; return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-day*864e5 };
const monthStart = ts => { const d=new Date(ts); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1) };
const keyFns = {W:weekStart, M:monthStart, '4h': ts => Math.floor(ts/144e5)*144e5};
function bucket(bars, keyFn){
  const out=[]; let w=null;
  for (const d of bars){ const k=keyFn(d.timestamp);
    if (!w || w.timestamp!==k){ w={timestamp:k,open:d.open,high:d.high,low:d.low,close:d.close,volume:d.volume||0}; out.push(w) }
    else { w.high=Math.max(w.high,d.high); w.low=Math.min(w.low,d.low); w.close=d.close; w.volume+=d.volume||0 } }
  return out;
}
function heikin(bars){
  const out=[]; let po, pc;
  for (const b of bars){ const c=(b.open+b.high+b.low+b.close)/4; const o = po==null ? (b.open+b.close)/2 : (po+pc)/2;
    out.push({...b, open:o, close:c, high:Math.max(b.high,o,c), low:Math.min(b.low,o,c)}); po=o; pc=c }
  return out;
}
let rawBars = [];
async function fetchDeribit(s, tf, end){
  const span = tf.agg==='W'||tf.agg==='M' ? 864e5 : tf.agg==='4h' ? 36e5 : tf.ms;
  const pages = tf.agg==='M' ? 3 : 1;
  let out = [], e = end;
  for (let i=0;i<pages;i++){
    const start = e - span*1000; let part;
    if (s.dvol){
      const r = await rpc('public/get_volatility_index_data',{currency:s.dvol,start_timestamp:start,end_timestamp:e,resolution:tf.dv});
      part = (r.data||[]).map(d=>({timestamp:d[0],open:d[1],high:d[2],low:d[3],close:d[4],volume:0})).sort((a,b)=>a.timestamp-b.timestamp);
    } else {
      const r = await rpc('public/get_tradingview_chart_data',{instrument_name:s.inst,start_timestamp:start,end_timestamp:e,resolution:tf.res});
      part = (!r || r.status==='no_data' || !r.ticks) ? [] : r.ticks.map((t,i)=>({timestamp:t,open:r.open[i],high:r.high[i],low:r.low[i],close:r.close[i],volume:r.volume[i]}));
    }
    if (!part.length) break;
    out = part.concat(out.filter(b=>b.timestamp>part[part.length-1].timestamp)); e = part[0].timestamp-1;
  }
  return out;
}

const BS_STEP = {'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1h':3600,'2h':7200,'4h':14400,'12h':43200,'D':86400,'W':86400,'M':86400};

    const j = await r.json(); const part=((j.data&&j.data.ohlc)||[]).map(o=>({timestamp:+o.timestamp*1000,open:+o.open,high:+o.high,low:+o.low,close:+o.close,volume:+o.volume}));
    if (!part.length) break; out = part.concat(out.filter(b=>b.timestamp>part[part.length-1].timestamp)); e = Math.floor(part[0].timestamp/1000)-1;

function bsSub(pair, cb, key){ bsCb[key]=cb;

const bigN = v => v==null||isNaN(v) ? '—' : Math.abs(v)>=1e9 ? (v/1e9).toFixed(2)+'B' : Math.abs(v)>=1e6 ? (v/1e6).toFixed(2)+'M' : Math.abs(v)>=1e3 ? (v/1e3).toFixed(2)+'K' : (+v).toFixed(2);
function smaArr(vals, n){ const out=[]; let s=0, c=0; for (let i=0;i<vals.length;i++){ const v=vals[i]; s+=v; c++; if (i>=n){ s-=vals[i-n]; c-- } out.push(i>=n-1 ? s/n : null) } return out }
function emaArr(vals, n){ const out=[], k=2/(n+1); let e=null, s=0; for (let i=0;i<vals.length;i++){ if (i<n-1){ s+=vals[i]; out.push(null) } else if (i===n-1){ s+=vals[i]; e=s/n; out.push(e) } else { e=vals[i]*k+e*(1-k); out.push(e) } } return out }
function stdArr(vals, n, ma){ return vals.map((v,i)=>{ if (i<n-1) return null; let s=0; for (let j=i-n+1;j<=i;j++) s+=(vals[j]-ma[i])**2; return Math.sqrt(s/n) }) }
const legend = (name, params, items) => ({name, calcParamsText:params, features:[], legends: items.map(([t,v,c])=>({title:t?{text:t+' ',color:'#787b86'}:'', value:{text:v,color:c}}))});
const tipIdx = (chart, crosshair, len) => crosshair && crosshair.dataIndex!=null ? Math.min(crosshair.dataIndex, len-1) : len-1;
// 1) Volumen kot v TW: stolpci v spodnjem delu cenovnega okna (24 % prosojnost) + SMA 20 (bela, 1 px)
klinecharts.registerIndicator({
  name:'LVOL', shortName:'Vol', calcParams:[20], figures:[],
  calc: (list, ind) => { const v=list.map(k=>k.volume||0), ma=smaArr(v, ind.calcParams[0]||20); return list.map((k,i)=>({vol:v[i], ma:ma[i], up:k.close>=k.open})) },
  draw: ({ctx, chart, indicator, bounding, xAxis}) => {
    const r=indicator.result; if (!r || !r.length) return true;
    const vr=chart.getVisibleRange(), bs=chart.getBarSpace(), from=Math.max(0,vr.from), to=Math.min(r.length, vr.to);
    let mx=0; for (let i=from;i<to;i++) mx=Math.max(mx, r[i].vol||0, r[i].ma||0); if (!mx) return true;
    const H=bounding.height*0.22, base=bounding.height, w=Math.max(1, bs.gapBar);
    for (let i=from;i<to;i++){ const d=r[i]; const x=xAxis.convertToPixel(i), h=d.vol/mx*H;
      ctx.fillStyle = d.up ? 'rgba(8,153,129,0.24)' : 'rgba(242,54,69,0.24)'; ctx.fillRect(x-w/2, base-h, w, h) }
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1; ctx.beginPath(); let st=false;
    for (let i=from;i<to;i++){ const m=r[i].ma; if (m==null) continue; const x=xAxis.convertToPixel(i), y=base-m/mx*H; st ? ctx.lineTo(x,y) : ctx.moveTo(x,y); st=true }
    ctx.stroke(); return true;
  },
  createTooltipDataSource: ({chart, indicator, crosshair}) => { const r=indicator.result||[]; const d=r[tipIdx(chart,crosshair,r.length)]||{};
    return legend('Vol', ' '+indicator.calcParams[0], [['',bigN(d.vol), d.up?'#089981':'#f23645'],['',bigN(d.ma),'#ffffff']]) }
});
// 2) MA-ji iz "mikul's combo indicator": EMA 10/50/200/21, SMA 7/200, Bollinger 20/2
const LMA_LINES = [
  ['ema10','EMA 10','#e91e63',1],['ema50','EMA 50','#ffeb3b',3],['ema200','EMA 200','#ffffff',4],['ema21','EMA 21','#00bcd4',2],
  ['sma7','SMA 7','#ff9800',1],['sma200','SMA 200','#ffeb3b',1],['bbu','BB zg.','#9598a1',1],['bbm','BB sred.','#d1d4dc',2],['bbl','BB sp.','#9598a1',1]
];
klinecharts.registerIndicator({
  name:'LMA', shortName:'MA (combo)', series:'price', precision:2, calcParams:[], shouldOhlc:false,
  figures: LMA_LINES.map(([key,title,color,size])=>({key, title:title+': ', type:'line', styles:()=>({color, size, style:'solid'})})),
  calc: list => { const c=list.map(k=>k.close);
    const e10=emaArr(c,10), e50=emaArr(c,50), e200=emaArr(c,200), e21=emaArr(c,21), s7=smaArr(c,7), s200=smaArr(c,200), bm=smaArr(c,20), sd=stdArr(c,20,bm);
    return list.map((k,i)=>({ema10:e10[i], ema50:e50[i], ema200:e200[i], ema21:e21[i], sma7:s7[i], sma200:s200[i], bbm:bm[i], bbu:bm[i]==null?null:bm[i]+2*sd[i], bbl:bm[i]==null?null:bm[i]-2*sd[i]})) },
  createTooltipDataSource: ({chart, indicator, crosshair}) => { const r=indicator.result||[]; const d=r[tipIdx(chart,crosshair,r.length)]||{}; const p=(chart.getSymbol()||{}).pricePrecision??2;
    return legend('MA', '', LMA_LINES.map(([k,t,c])=>[t, d[k]==null?'—':fmt(d[k],p), c])) }
});
// 3) RSI + MFI (14, 20, 80) kot Cryptoda skripta
function rsiArr(c, n){ const out=[null]; let ag=0, al=0;
  for (let i=1;i<c.length;i++){ const ch=c[i]-c[i-1], g=Math.max(ch,0), l=Math.max(-ch,0);
    if (i<=n){ ag+=g; al+=l; if (i===n){ ag/=n; al/=n; out.push(al===0?100:100-100/(1+ag/al)) } else out.push(null) }
    else { ag=(ag*(n-1)+g)/n; al=(al*(n-1)+l)/n; out.push(al===0?100:100-100/(1+ag/al)) } } return out }
function mfiArr(list, n){ const tp=list.map(k=>(k.high+k.low+k.close)/3), out=[];
  for (let i=0;i<list.length;i++){ if (i<n){ out.push(null); continue } let p=0, m=0;
    for (let j=i-n+1;j<=i;j++){ const f=tp[j]*(list[j].volume||0); if (tp[j]>tp[j-1]) p+=f; else if (tp[j]<tp[j-1]) m+=f }
    out.push(p+m===0 ? null : m===0 ? 100 : 100-100/(1+p/m)) } return out }
klinecharts.registerIndicator({
  name:'RSIMFI', shortName:'RSI + MFI', calcParams:[14,20,80], precision:2, minValue:0, maxValue:100,
  figures:[{key:'rsi', title:'RSI: ', type:'line', styles:()=>({color:'#4caf50', size:1})},{key:'mfi', title:'MFI: ', type:'line', styles:()=>({color:'#ffffff', size:2})}],
  calc: (list, ind) => { const [n]=ind.calcParams; const r=rsiArr(list.map(k=>k.close), n), m=mfiArr(list, n); return list.map((k,i)=>({rsi:r[i], mfi:m[i]})) },
  draw: ({ctx, chart, indicator, bounding, xAxis, yAxis}) => {
    const r=indicator.result||[], [, lo, hi]=indicator.calcParams; const vr=chart.getVisibleRange(), bs=chart.getBarSpace();
    const Y=v=>yAxis.convertToPixel(v), W=bounding.width, from=Math.max(0,vr.from), to=Math.min(r.length,vr.to), w=Math.max(1,bs.bar);
    ctx.fillStyle='rgba(120,123,134,0.12)'; ctx.fillRect(0, Y(hi), W, Y(lo)-Y(hi));
    for (let i=from;i<to;i++){ const m=r[i]&&r[i].mfi; if (m==null) continue; const x=xAxis.convertToPixel(i);
      if (m>hi){ ctx.fillStyle='rgba(242,54,69,0.35)'; ctx.fillRect(x-w/2,0,w,bounding.height) } else if (m<lo){ ctx.fillStyle='rgba(76,175,80,0.35)'; ctx.fillRect(x-w/2,0,w,bounding.height) } }
    for (let i=from;i<to;i++){ const v=r[i]&&r[i].rsi; if (v==null) continue; const x=xAxis.convertToPixel(i);
      if (v>70){ ctx.fillStyle='rgba(242,54,69,0.45)'; ctx.fillRect(x-w/2, Y(v), w, Y(70)-Y(v)) } else if (v<30){ ctx.fillStyle='rgba(41,98,255,0.45)'; ctx.fillRect(x-w/2, Y(30), w, Y(v)-Y(30)) } }
    ctx.setLineDash([4,4]); ctx.lineWidth=1; ctx.strokeStyle='rgba(149,152,161,0.7)';
    [70,30].forEach(v=>{ ctx.beginPath(); ctx.moveTo(0,Y(v)); ctx.lineTo(W,Y(v)); ctx.stroke() }); ctx.setLineDash([1,3]); ctx.beginPath(); ctx.moveTo(0,Y(50)); ctx.lineTo(W,Y(50)); ctx.stroke();
    return false;
  },
  createTooltipDataSource: ({chart, indicator, crosshair}) => { const r=indicator.result||[]; const d=r[tipIdx(chart,crosshair,r.length)]||{};
    return legend('RSI + MFI', ' '+indicator.calcParams.join(' '), [['RSI',d.rsi==null?'—':d.rsi.toFixed(2),'#4caf50'],['MFI',d.mfi==null?'—':d.mfi.toFixed(2),'#ffffff']]) }
});

const live = {};
function quote(s){
  if (s.src==='deribit' || s.src==='bitstamp'){ const l=live[s.id]||{}; return {last:l.last, chg:l.chg, pp:s.pp} }
  const m = META.symbols[s.id]||{}; return {last:m.last, chg:m.chg, pp:ppFor(m.last)}
}
function headerPrice(){
  const s = symOf(state.sym), q = quote(s);
  $('#symName').textContent = s.id; $('#price').textContent = fmt(q.last, q.pp);
  const c=$('#chg'); c.textContent = q.chg==null?'':(q.chg>=0?'+':'')+q.chg.toFixed(2)+'%'; c.className = q.chg==null?'':q.chg>=0?'up':'dn';
  if (q.last!=null) document.title = fmt(q.last,q.pp)+' · '+s.id;
}
function updateStatus(){
  const s = symOf(state.sym);
  if (s.src==='bitstamp') setStatus('V živo · Bitstamp (zgodovina od 2011)', 'ok');
  else if (s.src==='deribit') setStatus(wsOk?'V živo · Deribit':'Povezujem z Deribit…', wsOk?'ok':'bad');
  else { const m=META.symbols[s.id]||{};
    setStatus(m.ok ? (s.ljse ? 'Ljubljanska borza · samo dnevne sveče · zamik ~15-30 min' : 'Yahoo '+(m.yahoo||'')+' · zamik ~15-30 min')+' · posodobljeno '+agoTxt(META.updated) : 'Ni podatkov za '+s.id, m.ok?'delay':'bad') }
  $('#info').textContent = s.name;
}
function load(){
  const s = symOf(state.sym);
  let tf = tfOf(state.tf);
  if (!allowedTf(s, tf)){ state.tf = s.dvol ? '1h' : 'D'; tf = tfOf(state.tf) }
  closeDtb(); selectedId=null;
  chart.removeOverlay({groupId:'d'});
  chart.setSymbol({ticker:s.id, pricePrecision: s.pp!=null ? s.pp : ppFor((META.symbols[s.id]||{}).last), volumePrecision: 0});
  chart.setPeriod(tf.p);
  renderTfs(); headerPrice(); updateStatus(); markSel();
  undoStack=[]; redoStack=[];
  LS.set('sym2',state.sym); LS.set('tf',state.tf);
}

/* ---------- popup meniji ---------- */
const pop = $('#pop');
const isM = () => matchMedia('(max-width:900px)').matches;
function openPop(anchor, html, onClick, place){
  pop.innerHTML = html; pop.classList.add('open'); pop.classList.toggle('sheet', isM());
  if (isM()){ pop.onclick = e => { const it = e.target.closest('[data-v]'); if (!it) return; closePop(); onClick(it.dataset.v) }; return }
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = place==='right' ? r.right+4 : r.left, y = place==='right' ? r.top : place==='up' ? r.top-ph-4 : r.bottom+4;
  x = Math.max(4, Math.min(x, innerWidth-pw-4)); y = Math.max(4, Math.min(y, innerHeight-ph-4));
  pop.style.left = x+'px'; pop.style.top = y+'px';
  pop.onclick = e => { const it = e.target.closest('[data-v]'); if (!it) return; closePop(); onClick(it.dataset.v) };
}
function openPopAt(x, y, html, onClick){ openPop({getBoundingClientRect:()=>({left:x,right:x,top:y,bottom:y})}, html, onClick) }
const closePop = () => pop.classList.remove('open');
document.addEventListener('pointerdown', e => { if (!e.target.closest('#pop') && !e.target.closest('[data-popbtn]')) closePop() });
const item = (v, label, icon, on, kbd) => '<div class="it'+(on?' on':'')+'" data-v="'+esc(v)+'">'+(icon||'')+'<span>'+esc(label)+'</span>'+(kbd?'<kbd>'+esc(kbd)+'</kbd>':'')+'</div>';

  const q = $('#ssq'), list = $('#ssl');

    const t = q.value.trim().toUpperCase(); let h='';
    for (const s of Object.values(SYM)){
      if (t && !s.id.toUpperCase().includes(t) && !s.name.toUpperCase().includes(t)) continue;
      const qq=quote(s);
      h += '<div class="li" data-id="'+esc(s.id)+'"><div><b>'+esc(s.id)+'</b> <small>'+esc(s.name)+'</small></div><small>'+esc(s.src==='deribit'?'Deribit':s.src==='bitstamp'?'Bitstamp':s.ljse?'LJSE':s.group||'Yahoo')+' · '+fmt(qq.last,qq.pp)+'</small></div>';

    list.innerHTML = h || '<div class="sec">Ni zadetkov</div>';

/* ---------- watchlist ---------- */
function onDvol(s, d){ const l = live[s.id] = live[s.id]||{}; l.last = d.volatility; if (l.open) l.chg = (l.last/l.open-1)*100; paintRow(s.id); if (symOf(state.sym)===s) headerPrice() }
const ICOL = {BTCUSD:['#f7931a','₿'],'BTC-PERP':['#f7931a','₿'],DVOL:['#3a3a3a','D'],XAUUSD:['#d6a640','Au'],USOIL:['#1e1e1e','◆'],EURUSD:['#1e4fd8','€'],DXY:['#1f7a5c','$'],SPY:['#e8e8e8','S'],VIX:['#43a047','V'],
  GOOGL:['#ffffff','G'],TSM:['#d32f2f','T'],ADBE:['#e5261f','A'],AMZN:['#ff9900','a'],META:['#0668e1','M'],NFLX:['#141414','N'],MSTR:['#f7931a','₿'],RACE:['#d40000','F'],MCD:['#da291c','M'],NVDA:['#76b900','N'],MSFT:['#00a4ef','M'],AAPL:['#e8e8e8',''],TSLA:['#cc0000','T'],
  KRK:['#00a651','K'],KRKG:['#00a651','K'],NLB:['#1d3a8a','N'],NLBR:['#1d3a8a','N'],SBITOP:['#0b5aa6','S'],LKPG:['#0a4fa0','L'],PETG:['#d71920','P']};
function icoHtml(s){ let [bg,t] = ICOL[s.id] || [null, null];
  if (!bg){ let h=0; for (const ch of s.id) h=(h*31+ch.charCodeAt(0))>>>0; bg='hsl('+(h%360)+',45%,38%)'; t=s.id.replace(/[^A-Z0-9]/gi,'').charAt(0) }
  const light = /^#(e|f|d)/i.test(bg); return '<span class="ic" style="background:'+bg+';color:'+(light?'#111':'#fff')+'">'+esc(t)+'</span>' }
function rowHtml(s, sub){ const live=(s.src==='deribit'||s.src==='bitstamp');
  return '<div class="row" data-id="'+esc(s.id)+'">'+icoHtml(s)+'<b><span class="sy">'+esc(s.id)+(live?'<span class="live" title="v živo"></span>':'')+'</span><small>'+esc(sub||s.name)+'</small></b><span class="n"></span><span class="a"></span><span class="p"></span></div>' }
function renderWL(){
  let h = '';
  for (const g of WL){
    const closed = state.closed.includes(g.group);
    h += '<div class="grp'+(closed?' closed':'')+'" data-g="'+esc(g.group)+'">'+esc(g.group.toUpperCase())+'</div>';
    if (closed) continue;
    for (const it of g.items){ const s=SYM[it.id];
      h += rowHtml(s) }
  }
  const extra = LS.get('customSyms',[]);
  if (extra.length){ h += '<div class="grp" data-g="">DERIBIT (DODANO)</div>';
    for (const id of extra) h += rowHtml(symOf(id), 'desni klik = odstrani') }
  h += '<div class="wlf">Delnice/ETF/forex: Yahoo, slovenske delnice: Ljubljanska borza; robot osveži vsakih 15 min med 8 in 23 uro (posodobljeno '+(META.updated?agoTxt(META.updated):'—')+'). BTC in DVOL: Deribit v živo. Simbole urejaš v <b>watchlist.json</b>.</div>';
  const box=$('#wlList'); box.innerHTML = h;
  box.querySelectorAll('.row').forEach(r=>{ paintRow(r.dataset.id); r.onclick=()=>pick(r.dataset.id);
    r.oncontextmenu=e=>{ const id=r.dataset.id; if (!LS.get('customSyms',[]).includes(id)) return; e.preventDefault(); LS.set('customSyms', LS.get('customSyms',[]).filter(x=>x!==id)); renderWL() } });
  box.querySelectorAll('.grp[data-g]').forEach(g=>g.onclick=()=>{ const n=g.dataset.g; if(!n) return; state.closed = state.closed.includes(n)?state.closed.filter(x=>x!==n):[...state.closed,n]; LS.set('closedGroups',state.closed); renderWL() });
  markSel();
  const pills=$('#wlPills'); if (pills){ pills.innerHTML = WL.map((g,i)=>'<button data-gi="'+i+'"'+(i===0?' class="on"':'')+'>'+esc(g.group)+'</button>').join('');
    pills.onclick = e => { const b=e.target.closest('[data-gi]'); if (!b) return; pills.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      const gEl=[...document.querySelectorAll('#wlList .grp')][+b.dataset.gi]; if (gEl) $('#wlList').scrollTo({top:gEl.offsetTop-$('#wlList').offsetTop, behavior:'smooth'}) } }
}
function paintRow(id){
  const r = document.querySelector('.row[data-id="'+CSS.escape(id)+'"]'); if (!r) return;
  const q = quote(symOf(id));
  r.querySelector('.n').textContent = fmt(q.last, q.pp);
  const p = r.querySelector('.p'); p.textContent = q.chg==null?'—':(q.chg>=0?'+':'−')+Math.abs(q.chg).toFixed(2)+'%'; p.className='p '+(q.chg==null?'':q.chg>=0?'up':'dn');
  const a = r.querySelector('.a'); if (a){ const ab = (q.last!=null && q.chg!=null) ? q.last - q.last/(1+q.chg/100) : null;
    a.textContent = ab==null ? '' : (ab>=0?'+':'−')+fmt(Math.abs(ab), q.pp); a.className='a '+(ab==null?'':ab>=0?'up':'dn') }
}
function markSel(){ document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel', r.dataset.id===state.sym)) }
function startLiveWL(){
  for (const s of Object.values(SYM)){ if (s.src!=='bitstamp') continue;
    fetch('https://www.bitstamp.net/api/v2/ohlc/'+s.pair+'/?step=86400&limit=1').then(r=>r.json()).then(j=>{ const t=j.data.ohlc[j.data.ohlc.length-1]; const l=live[s.id]=live[s.id]||{}; l.open=+t.open; if (l.last==null) l.last=+t.close; l.chg=(l.last/l.open-1)*100; paintRow(s.id); if (symOf(state.sym)===s) headerPrice() }).catch(()=>{});
    let tp=0; bsSub(s.pair, t=>{ const l=live[s.id]=live[s.id]||{}; l.last=t.price; if (l.open) l.chg=(l.last/l.open-1)*100; const now=Date.now(); if (now-tp>500){ tp=now; paintRow(s.id); if (symOf(state.sym)===s) headerPrice() } }, 'wl_'+s.id);
  }
  for (const s of Object.values(SYM)){
    if (s.src!=='deribit' || !WL.some(g=>g.items.some(i=>i.id===s.id))) continue;
    if (s.dvol){
      const ch='deribit_volatility_index.'+s.dvol.toLowerCase()+'_usd'; wlChs.add(ch); subscribe(ch, d=>onDvol(s,d));
      const now=Date.now(); rpc('public/get_volatility_index_data',{currency:s.dvol,start_timestamp:now-3*864e5,end_timestamp:now,resolution:'1D'})
        .then(r=>{ const d=(r.data||[]).sort((a,b)=>a[0]-b[0]); const t=d[d.length-1]; if(!t) return; const l=live[s.id]=live[s.id]||{}; l.open=t[1]; if(l.last==null) l.last=t[4]; l.chg=(l.last/l.open-1)*100; paintRow(s.id); headerPrice() }).catch(()=>{});
    } else {
      const ch='ticker.'+s.inst+'.100ms'; wlChs.add(ch);
      let tp=0; subscribe(ch, d=>{ const l=live[s.id]=live[s.id]||{}; l.last=d.last_price; l.chg=d.stats&&d.stats.price_change;
        const now=Date.now(); if (now-tp>500){ tp=now; paintRow(s.id); if (symOf(state.sym)===s) headerPrice() } });
    }
  }
}
function toggleWL(){ const a=$('#app');
  if (matchMedia('(max-width:900px)').matches) a.classList.toggle('wlopen');
  else { a.classList.toggle('nowl'); LS.set('nowl', a.classList.contains('nowl')); $('#wlBtn').classList.toggle('on', !a.classList.contains('nowl')) }
  setTimeout(()=>chart.resize(),0) }
$('#wlBtn').onclick=toggleWL; $('#wlBtnM').onclick=toggleWL;
const mq=matchMedia('(max-width:900px)'); const mqf=()=>{ $('#wlBtnM').style.display = mq.matches?'inline-flex':'none' }; mq.addEventListener('change',mqf); mqf();

async function loadMeta(){
  try { const r = await fetch('data/meta.json?t='+Date.now()); if (!r.ok) throw 0; const m = await r.json();
    const changed = m.updated !== META.updated; META = m; return changed } catch(e){ return false }
}
setInterval(async ()=>{ if (await loadMeta()){ renderWL(); headerPrice(); if (symOf(state.sym).src==='yahoo') load(); else updateStatus() } }, 5*60*1000);

$('#mMore').onclick = e => moreMenu(e.currentTarget);
$('#fab').onclick = e => {
  let h='';
  const secs=[['Linije','lines'],['Fibonacci','fib'],['Oblike','shapes'],['Napovedi in meritve','measure'],['Besedilo','text']];
  for (const [t,id] of secs){ const g=GROUPS.find(x=>x.id===id); h+='<div class="hd">'+t+'</div><div class="tgrid">'+g.items.map(i=>'<div class="it'+(tool===i[0]?' on':'')+'" data-v="'+i[0]+'">'+ICON[i[0]]+'<span>'+esc(i[1])+'</span></div>').join('')+'</div>' }
  const ov=myOverlays(), locked=ov.length>0&&ov.every(o=>o.lock), hidden=ov.length>0&&ov.every(o=>!o.visible);
  h+='<div class="hd">Nastavitve risanja</div><div class="tgrid">'+
    '<div class="it'+(state.magnet!=='off'?' on':'')+'" data-v="_mag">'+ICON.magnet+'<span>Magnet</span></div>'+
    '<div class="it'+(state.stay?' on':'')+'" data-v="_stay">'+ICON.stay+'<span>Ostani v risanju</span></div>'+
    '<div class="it'+(locked?' on':'')+'" data-v="_lock">'+(locked?ICON.lock:ICON.unlock)+'<span>'+(locked?'Odkleni':'Zakleni')+' vse</span></div>'+
    '<div class="it'+(hidden?' on':'')+'" data-v="_hide">'+(hidden?ICON.eyeOff:ICON.eye)+'<span>'+(hidden?'Pokaži':'Skrij')+' vse</span></div>'+
    '<div class="it" data-v="_undo">'+SV('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/>')+'<span>Razveljavi</span></div>'+
    '<div class="it" data-v="_redo">'+SV('<path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h4"/>')+'<span>Uveljavi</span></div>'+
    '<div class="it" data-v="_del">'+ICON.trash+'<span>Izbriši risbe</span></div>'+
    (tool?'<div class="it" data-v="_cancel">'+SV('<path d="M6 6l12 12M18 6L6 18"/>')+'<span>Prekliči</span></div>':'')+'</div>';
  openPop(e.currentTarget, h, v=>{
    if (!v.startsWith('_')){ const g=GROUPS.find(x=>x.items.some(i=>i[0]===v)); if (g){ groupSel[g.id]=v; LS.set('groupSel',groupSel) } startTool(v); return }
    if (v==='_mag'){ state.magnet = state.magnet==='off' ? 'strong' : 'off'; LS.set('magnet2',state.magnet); toast(state.magnet==='off'?'Magnet izklopljen':'Magnet vklopljen') }
    if (v==='_stay'){ state.stay=!state.stay; LS.set('stay',state.stay); toast(state.stay?'Ostanem v načinu risanja':'Po risbi nazaj na kazalec') }
    if (v==='_lock'){ const o=myOverlays(); const l=!(o.length&&o.every(x=>x.lock)); o.forEach(x=>chart.overrideOverlay({id:x.id,lock:l})); saveDrawings(); toast(l?'Risbe zaklenjene':'Risbe odklenjene') }
    if (v==='_hide'){ const o=myOverlays(); const vis=o.length>0&&o.every(x=>!x.visible); o.forEach(x=>chart.overrideOverlay({id:x.id,visible:vis})) }
    if (v==='_undo') undo(); if (v==='_redo') redo(); if (v==='_cancel') cancelTool();
    if (v==='_del'){ if (!myOverlays().length) return; if (confirm('Izbrišem vse risbe na '+state.sym+'?')){ snapshot(); chart.removeOverlay({groupId:'d'}); saveDrawings(); closeDtb(); toast('Risbe izbrisane') } }
    renderLeft() });

/* ---------- tipkovnica ---------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) { if (e.key==='Escape') closeModal(); return }
  const k=e.key.toLowerCase();
  if ((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return }
  if ((e.ctrlKey||e.metaKey) && k==='y'){ e.preventDefault(); redo(); return }
  if (e.altKey && k==='r'){ e.preventDefault(); resetView(); return }
  if (e.altKey && k==='t'){ e.preventDefault(); startTool('segment'); return }
  if (e.altKey && k==='h'){ e.preventDefault(); startTool('horizontalStraightLine'); return }
  if (e.altKey && k==='f'){ e.preventDefault(); startTool('fibonacciLine'); return }
  if (e.key==='/'){ e.preventDefault(); indDialog(); return }
  if ((e.key==='Delete'||e.key==='Backspace') && selectedId){ snapshot(); chart.removeOverlay({id:selectedId}); selectedId=null; closeDtb(); saveDrawings(); renderLeft(); return }
  if (e.key==='Escape'){ closePop(); closeModal(); cancelTool(); return }
  if (/^[a-z0-9]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey && !modal.classList.contains('open')){ e.preventDefault(); symbolSearch(e.key.toUpperCase()); $('#ssq').dispatchEvent(new Event('input')) }
});

/* ---------- samodejna posodobitev, ko izide nova verzija ---------- */
const BUILD = '__BUILD__';
async function checkVersion(){ if (BUILD.startsWith('__')) return;
  try { const v=(await (await fetch('version.txt?t='+Date.now(),{cache:'no-store'})).text()).trim(); if (v && v!==BUILD) location.reload() } catch(e){} }
setInterval(checkVersion, 120000); document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) checkVersion() });
/* ---------- start ---------- */
(async () => {
  checkVersion();
  renderCt(); renderLeft(); connect();
  try { const r = await fetch('watchlist.json?t='+Date.now()); WL = await r.json() }
  catch(e){ WL = [{group:'Glavno', items:[{id:'BTCUSD',src:'deribit',inst:'BTC-PERPETUAL',name:'BTC perp (Deribit)'},{id:'DVOL',src:'deribit',inst:'DVOL:BTC',name:'BTC DVOL (Deribit)'}]}] }
  WL.forEach(g=>g.items.forEach(it=>addSym(it, g.group)));
  LS.get('customSyms',[]).forEach(id=>{ if(!SYM[id]) addSym({id,src:'deribit',inst:id},'Deribit') });
  await loadMeta();
  try { const r = await fetch('tv_drawings.json?t='+Date.now()); if (r.ok){ const tv = await r.json();
    for (const [sid, list] of Object.entries(tv)){ if (LS.get('tvimp_'+sid,false)) continue;
      const key='draw_'+sid, cur=LS.get(key,[]);
      for (const d of list){ if (d.name==='brush' && d.points.length<2) continue;
        cur.push({name:d.name, points:d.points, styles:lineStyle(d.c, d.w, d.s===2?'dash':d.s===1?'dot':null), lock:false, extendData: d.fill ? {fill: hexA(d.fill[0], d.fill[1])} : undefined}) }
      LS.set(key, cur); LS.set('tvimp_'+sid, true) } } } catch(e){}
  if (!SYM[state.sym]) state.sym = 'BTCUSD';
  renderWL(); startLiveWL();
  state.inds.forEach(addInd);
  load(); setAxis(state.axis);
})();
}
