name: Posodobi podatke in objavi

on:
  schedule:
    - cron: "*/15 * * * *"   # vsakih 15 min, vse dni (alarmi za BTC tudi ponoči in čez vikend)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: false
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yfinance
      - run: python scripts/fetch.py
      - id: alerts
        run: python scripts/alerts.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || vars.TELEGRAM_TOKEN }}
      - if: steps.alerts.outputs.changed == 'true'
        run: |
          git config user.name "luka-charts-robot"
          git config user.email "robot@users.noreply.github.com"
          git add alerts.json
          git commit -m "alarmi: posodobitev [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main || (git rebase --abort || true; echo "alarmi: konflikt, poskusim ob naslednjem zagonu")
      - run: mkdir -p _site && cp index.html watchlist.json tv_drawings.json _site/ && cp -r data _site/ && sed -i "s/__BUILD__/${GITHUB_SHA}/" _site/index.html && echo "${GITHUB_SHA}" > _site/version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # GitHub "schedule" zažene robota samo nekajkrat na dan (preverjeno: 5 zagonov v 2 dneh).
  # Zato vsak zagon po ~11 min sproži naslednjega (workflow_dispatch). Teče naprej samo najnovejša veriga.
  next:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: sleep 660
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newer=$(gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.id > ${{ github.run_id }} and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending"))] | length')
          echo "novejših aktivnih zagonov: $newer"
          if [ "$newer" = "0" ]; then gh workflow run update.yml --repo "${{ github.repository }}" --ref main; echo "sprožen naslednji zagon"; fi
